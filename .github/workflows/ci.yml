name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: clang
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4

      - name: Build (release, -Werror)
        run: make WERROR=1 all

      - name: Unit tests
        run: make WERROR=1 test

      - name: Unit tests under ASan/UBSan
        run: make sanitize

      - name: Smoke test CLI
        run: |
          ./build/workwatcher --version
          ./build/workwatcher --help >/dev/null
          # Без TTY приложение должно завершиться с понятной ошибкой, а не зависнуть.
          if ./build/workwatcher </dev/null; then exit 1; fi

  lint:
    name: clang-format / clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy

      - name: Check formatting
        run: make format-check

      - name: Static analysis
        run: make lint
